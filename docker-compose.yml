
services:
  mysql:
    image: mysql:8.0
    container_name: ride_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ride_db
    ports:
      - "3307:3306"  #host:container
    volumes:
      - mysql_data:/var/lib/mysql
  redis:
    image: redis:latest
    container_name: ride_redis
    restart: always
    ports:
      - "6379:6379"
volumes:
  mysql_data: